name: Verify Roblox foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify and extract pinned official tools
        run: |
          mkdir -p .tools/luau .tools/rojo
          curl --fail --location --retry 3 https://github.com/luau-lang/luau/releases/download/0.742/luau-ubuntu.zip -o .tools/luau.zip
          curl --fail --location --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o .tools/rojo.zip
          echo '152058b98c60ff1f5b5ec9bca0b8eb37793cae161dd3a05608cc3d8738ba1a4d  .tools/luau.zip' | sha256sum --check
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  .tools/rojo.zip' | sha256sum --check
          unzip -q .tools/luau.zip -d .tools/luau
          unzip -q .tools/rojo.zip -d .tools/rojo
          chmod +x .tools/luau/luau .tools/luau/luau-compile .tools/rojo/rojo
      - run: npm test
      - run: npm run build
